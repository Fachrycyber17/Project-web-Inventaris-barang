<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Katalog Barang</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            flex-direction: column;
            height: 100vh;
            background-color: #e4e4e4;
        }

        .top-header {
            background-color: #242424;
            color: #ffffff;
            height: 50px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 18px;
            letter-spacing: 1px;
            position: relative;
            z-index: 10;
        }

        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .sidebar {
            width: 220px;
            background-color: #c2c2c2;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #a0a0a0;
        }

        .logo-container {
            padding: 20px;
            font-size: 22px;
            color: #333;
            position: relative;
        }

        .logo-container .heart-icon {
            font-size: 14px;
            position: absolute;
            top: 15px;
            left: 56px; /* Posisi di atas huruf 'i' dan 'm' */
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 10px;
        }

        .nav-menu a {
            text-decoration: none;
            color: #333;
            padding: 10px 20px;
            font-size: 15px;
            transition: all 0.3s;
        }

        .nav-menu a.active {
            background-color: #222222;
            color: #ffffff;
        }

        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #e0e0e0;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            border-bottom: 2px solid #c0c0c0;
            background-color: #e6e6e6;
        }

        .search-container input {
            width: 300px;
            padding: 8px 15px;
            border-radius: 20px;
            border: none;
            background-color: #efefef;
            box-shadow: 2px 3px 5px rgba(0, 0, 0, 0.15);
            outline: none;
            font-size: 14px;
            color: #555;
        }

        .search-container input::placeholder {
            color: #999;
        }

        .user-info {
            font-size: 14px;
            color: #333;
        }

        .catalog-section {
            padding: 20px 30px;
            overflow-y: auto;
            flex: 1;
        }

        .catalog-title {
            font-size: 18px;
            font-weight: normal;
            color: #333;
            margin-bottom: 15px;
        }

        .filter-tags {
            display: flex;
            gap: 12px;
            margin-bottom: 25px;
        }

        .filter-tags button {
            padding: 6px 18px;
            border-radius: 15px;
            border: none;
            background-color: #d6d6d6;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            font-size: 14px;
            color: #333;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 25px;
            max-width: 900px;
        }

        .card {
            background-color: #dedede;
            border: 1px solid #c5c5c5;
            box-shadow: 3px 4px 6px rgba(0, 0, 0, 0.2);
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 15px;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 4px 6px 10px rgba(0, 0, 0, 0.3);
        }

        .card-image {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 80%;
            height: 110px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card-image img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            mix-blend-mode: multiply; 
        }

        .card-label {
            font-size: 14px;
            color: #222;
        }
    </style>
</head>
<body>

    <header class="top-header">
        KATALOG BARANG
    </header>

    <div class="main-container">
        <aside class="sidebar">
            <div class="logo-container">
                Pinjamin<span class="heart-icon">♡</span>
            </div>
            <nav class="nav-menu">
                <a href="katalog barang.html" class="active">Katalog Barang</a>
                <a href="form peminjaman.html">Peminjaman Saya</a>
                <a href="#">Riwayat</a>
                <a href="#">Profil</a>
            </nav>
        </aside>

        <main class="content-area">
            <div class="action-bar">
                <div class="search-container">
                    <input type="text" placeholder="Cari Barang...">
                </div>
                <div class="user-info">
                    Nama User
                </div>
            </div>

            <div class="catalog-section">
                <h1 class="catalog-title">Katalog Barang</h1>
                
                <div class="filter-tags">
                    <button>Semua</button>
                    <button>Elektronik</button>
                    <button>Alat Lab</button>
                    <button>Olahraga</button>
                </div>

                <div class="grid-container">
                   <div class="card" onclick="window.location.href='form_peminjaman.html?barang=camera'">
                     <div class="card-image">
                        <img src="https://png.pngtree.com/png-vector/20240211/ourmid/pngtree-transparent-background-canon-eos-r-mirrorless-digital-camera-with-24-105mm-png-image_11734469.png" alt="Camera">
                    </div>
                <div class="card-label">Camera</div>
            </div>

                    <div class="card" onclick="window.location.href='form_peminjaman.html?barang=Proyektor'">
                        <div class="card-image">
                            <img src="https://png.pngtree.com/thumb_back/fh260/background/20220908/pngtree-multimedia-projector-isolated-on-white-background-media-photographic-blue-photo-image_6552572.jpg" alt="Proyektor">
                        </div>
                        <div class="card-label">Proyektor</div>
                    </div>

                    <div class="card" onclick="window.location.href='form_peminjaman.html?barang=Laptop'">
                        <div class="card-image">
                            <img src="https://thumbs.dreamstime.com/b/silver-laptop-blank-screen-set-white-background-screen-open-displaying-no-content-keyboard-features-black-470482540.jpg" alt="Laptop">
                        </div>
                        <div class="card-label">Laptop</div>
                    </div>

                    <div class="card" onclick="window.location.href='form_peminjaman.html?barang=mic wireless'">
                        <div class="card-image">
                            <img src="https://static.vecteezy.com/system/resources/thumbnails/006/306/294/small/new-wireless-microphone-isolated-on-white-background-free-photo.JPG" alt="Mic wireless">
                        </div>
                        <div class="card-label">Mic wireless</div>
                    </div>

                    <div class="card" onclick="window.location.href='form_peminjaman.html?barang=tripod'">
                        <div class="card-image">
                            <img src="https://toppng.com/uploads/preview/best-free-video-camera-on-tripod-png-image-video-camera-tripod-11563050894nlqqzyijiu.png" alt="Tripod">
                        </div>
                        <div class="card-label">tripod</div>
                    </div>
                    
                    <div class="card" onclick="window.location.href='form_peminjaman.html?barang=Speaker'">
                        <div class="card-image">
                            <img src="https://img.magnific.com/premium-psd/red-speaker-isolated-transparent-background_1136825-15597.jpg?semt=ais_hybrid&w=740&q=80" alt="Speaker">
                        </div>
                        <div class="card-label">Speaker</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

</body>
</html>
