<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pinjamin</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #d9d9d9; /* Warna latar belakang abu-abu terang */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            text-align: center;
            padding: 20px;
        }

        /* Bagian Logo dan Judul */
        .logo-container {
            margin-bottom: 25px;
        }

        .logo {
            font-size: 42px;
            margin: 0;
            font-weight: normal;
            position: relative;
            display: inline-block;
            letter-spacing: 1px;
        }
        
        /* Menambahkan icon hati kecil di atas huruf i */
        .logo::after {
            content: "♡";
            font-size: 16px;
            position: absolute;
            top: -12px;
            right: 18px;
            font-weight: bold;
        }

        .subtitle {
            font-size: 18px;
            color: #333;
            margin-top: 5px;
        }

        /* Bagian Form Input */
        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 16px;
            margin-bottom: 8px;
            color: #000;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            border: none;
            background-color: #bcbcbc; /* Warna abu-abu gelap untuk input */
            box-shadow: 0 4px 5px rgba(0, 0, 0, 0.2); /* Efek bayangan di bawah input */
            outline: none;
            color: #333;
        }

        .input-group input::placeholder {
            color: #666;
        }

        /* Tombol Masuk */
        .btn-login {
            width: 100%;
            background-color: #000;
            color: #fff;
            padding: 15px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .btn-login:hover {
            background-color: #222;
        }

        /* Teks Footer */
        .footer-text {
            font-size: 16px;
            color: #333;
        }

        .footer-text a {
            color: #4da6ff; /* Warna biru muda */
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo-container">
            <h1 class="logo">Pinjamin</h1>
            <div class="subtitle">Masuk ke akun kamu</div>
        </div>

        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="masukkan email anda">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="masukkan password anda">
        </div>

        <button class="btn-login">Masuk</button>

        <div class="footer-text">
            Belum punya akun? <a href="#">Daftar</a>
        </div>
    </div>
</head>
<body>
    
</body>
</html>
