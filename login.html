<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PinjamIn</title>
</head>
<body>

    <div class="login-container">
        <div class="logo-container">
            <h1 class="logo">PinjamIn</h1>
            <div class="subtitle">Masuk ke akun kamu</div>
        </div>

        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="masukkan email anda">
        </div>

        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="masukkan password anda">
        </div>

        
        <button class="btn-login" onclick="prosesLogin()">Masuk</button>

        <div class="footer-text">
            Belum punya akun? <a href="daftar.html">Daftar</a>
        </div>
    </div>

    <script>
        function prosesLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

           
            if (email && password) {
               
                window.location.href = "dashboard.html";
            } else {
               
                alert("Harap masukkan email dan password Anda!");
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #d9d9d9; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .login-container {
            width: 100%;
            max-width: 380px;
            text-align: center;
            padding: 20px;
        }

        .logo-container {
            margin-bottom: 25px;
        }

        .logo {
            font-size: 42px;
            margin: 0;
            font-weight: normal;
            position: relative;
            display: inline-block;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 18px;
            color: #333;
            margin-top: 5px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 16px;
            margin-bottom: 8px;
            color: #000;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            font-size: 15px;
            border: none;
            background-color: #bcbcbc; 
            box-shadow: 0 4px 5px rgba(0, 0, 0, 0.2); 
            outline: none;
            color: #333;
        }

        .input-group input::placeholder {
            color: #666;
        }

        .btn-login {
            width: 100%;
            background-color: #000;
            color: #fff;
            padding: 15px;
            font-size: 16px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 15px;
        }

        .btn-login:hover {
            background-color: #222;
        }

        .footer-text {
            font-size: 16px;
            color: #333;
        }

        .footer-text a {
            color: #4da6ff; 
            text-decoration: underline;
        }
    </style>
</body>
</html>
