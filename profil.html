<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil - PinjamIn</title>
</head>
<body>

    <div class="side-strip"></div>

   
    <aside class="sidebar">
        <div class="logo">
            Pinjam<span class="logo-i">I</span>n
        </div>
        <ul class="nav-menu">
            <li class="nav-item"><a href="dashboard.html">Dashboard</a></li>
            <li class="nav-item"><a href="katalog barang.html">Katalog Barang</a></li>
            <li class="nav-item"><a href="form_peminjaman.html">Peminjaman Saya</a></li>
            <li class="nav-item active"><a href="profil.html">Profil</a></li>
        </ul>
    </aside>

    <div class="main-wrapper">
       
        <header class="header">
            <div class="breadcrumb">DASHBOARD &gt; PROFIL</div>
        </header>

        
        <main class="content">
            
            <div class="avatar-card">
                <svg viewBox="0 0 100 100" class="avatar-svg">
                    <circle cx="50" cy="38" r="20" fill="#7a8290" />
                    <path d="M 15 88 C 15 62, 85 62, 85 88 Z" fill="#7a8290" />
                </svg>
            </div>

            
            <section class="profile-card">
                <h2 class="profile-title">DETAIL PROFIL</h2>
                
                <form id="profileForm">
                    <div class="form-group">
                        <label for="nama">Nama Lengkap</label>
                        <input type="text" id="nama" placeholder="Masukkan nama lengkap" readonly>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" placeholder="Masukkan email" readonly>
                    </div>

                    <div class="form-group">
                        <label for="telepon">Nomor Telepon</label>
                        <input type="tel" id="telepon" placeholder="Masukkan nomor telepon" readonly>
                    </div>

                    <div class="form-group">
                        <label for="alamat">Alamat</label>
                        <input type="text" id="alamat" placeholder="Masukkan alamat lengkap" readonly>
                    </div>
                </form>
            </section>
        </main>
    </div>

  
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            const nama = localStorage.getItem('user_nama');
            const email = localStorage.getItem('user_email');
            const telepon = localStorage.getItem('user_telepon');
            const alamat = localStorage.getItem('user_alamat');

            
            if (nama) document.getElementById('nama').value = nama;
            if (email) document.getElementById('email').value = email;
            if (telepon) document.getElementById('telepon').value = telepon;
            if (alamat) document.getElementById('alamat').value = alamat;
        });
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            background-color: #d8d8d8;
            overflow-x: hidden;
        }

        .side-strip {
            width: 35px;
            background-color: #1e1e1e;
            flex-shrink: 0;
        }

      
        .sidebar {
            width: 230px;
            background-color: #888888;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            gap: 25px;
            flex-shrink: 0;
        }

        .logo {
            font-size: 24px;
            color: #222222;
            margin-bottom: 10px;
        }

        .logo-i {
            position: relative;
            display: inline-block;
        }

        

        .nav-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .nav-item a {
            text-decoration: none;
            color: #2b2b2b;
            font-size: 18px;
            font-weight: 500;
            display: block;
            transition: color 0.2s;
        }

        .nav-item.active a, .nav-item a:hover {
            color: #000000;
            font-weight: bold;
        }

      
        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        
        .header {
            background-color: #d0d0d0;
            padding: 18px 30px;
            border-bottom: 1px solid #b8b8b8;
        }

        .breadcrumb {
            font-size: 18px;
            font-weight: bold;
            color: #111111;
            letter-spacing: 0.5px;
        }

       
        .content {
            padding: 50px 60px;
            display: flex;
            align-items: flex-start;
            gap: 50px;
            flex-grow: 1;
        }

      
        .avatar-card {
            width: 220px;
            height: 220px;
            background-color: #ffffff;
            border-radius: 50%;
            border: 2px solid #b0b0b0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .avatar-svg {
            width: 100%;
            height: 100%;
        }

       
        .profile-card {
            background-color: #cccccc;
            border: 1px solid #b5b5b5;
            border-radius: 40px;
            padding: 35px 45px;
            flex-grow: 1;
            max-width: 550px;
        }

        .profile-title {
            font-size: 22px;
            font-weight: bold;
            color: #111111;
            margin-bottom: 25px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 17px;
            font-weight: bold;
            color: #111111;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 20px;
            background-color: #f2f2f2;
            border: 1px solid #d0d0d0;
            border-radius: 25px;
            font-size: 16px;
            color: #333333;
            outline: none;
            box-sizing: border-box;
        }

        .form-group input:focus {
            background-color: #ffffff;
            border-color: #888888;
        }
    </style>
</body>
</html>
