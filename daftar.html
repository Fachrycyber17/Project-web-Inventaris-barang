<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar - PinjamIn</title>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            Pinjam<span class="logo-i">I</span>n
        </div>
        <div class="subtitle">Daftar akun baru kamu</div>

        <form id="registerForm">
            <div class="form-group">
                <label>Nama Lengkap</label>
                <input type="text" id="nama" placeholder="masukkan nama anda" required>
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="masukkan email anda" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="masukkan password anda" required>
            </div>
            
            <div class="form-group">
                <label>No Telepon</label>
                <input type="tel" id="telepon" placeholder="masukkan No Telepon anda" required>
            </div>
            
            <div class="form-group">
                <label>Alamat</label>
                <input type="text" id="alamat" placeholder="masukkan Alamat anda" required>
            </div>

            <button type="button" class="btn-submit" onclick="prosesDaftar()">Daftar</button>
        </form>

        <div class="footer-text">
            Sudah punya akun? <a href="login.html">Masuk</a>
        </div>
    </div>

    <script>
        function prosesDaftar() {
            const nama = document.getElementById('nama').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const telepon = document.getElementById('telepon').value;
            const alamat = document.getElementById('alamat').value;

            if (nama && email && password && telepon && alamat) {
                
                localStorage.setItem('user_nama', nama);
                localStorage.setItem('user_email', email);
                localStorage.setItem('user_telepon', telepon); 
                localStorage.setItem('user_alamat', alamat); 

                window.location.href = "dashboard.html";
            } else {
                alert("Harap isi semua kolom!");
            }
        }
    </script>

    <style>
        body {
            background-color: #e5e5e5; 
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            width: 450px;
            text-align: center;
        }

        .logo-container {
            font-size: 56px;
            color: #111;
            margin-bottom: 10px;
        }

        .logo-i {
            position: relative;
            display: inline-block;
        }

        .subtitle {
            font-size: 20px;
            color: #333;
            margin-bottom: 40px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
            color: #111;
        }

        .form-group input {
            width: 100%;
            padding: 16px;
            border: none;
            background-color: #bcbcbc; 
            box-sizing: border-box;
            font-size: 16px;
            color: #333;
            outline: none;
        }

        .form-group input::placeholder {
            color: #666;
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background-color: #222222; 
            color: white;
            border: none;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .btn-submit:hover {
            background-color: #000000;
        }

        .footer-text {
            margin-top: 25px;
            font-size: 18px;
            color: #333;
        }

        .footer-text a {
            color: #4da3ff; 
            text-decoration: underline;
        }
    </style>
</body>
</html>
